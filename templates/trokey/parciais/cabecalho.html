<header class="topo">
  <a class="marca" href="{{inicioUrl}}">{{#tema.logo}}<img class="logo" src="{{tema.logo}}" alt="{{site.nome}}" width="154" height="40">{{/tema.logo}}{{^tema.logo}}<span class="logo-txt">{{site.nome}}</span>{{/tema.logo}}</a>
  <input type="checkbox" id="menu-abre" class="menu-abre" aria-hidden="true">
  <label for="menu-abre" class="menu-botao" aria-label="Abrir menu"><span></span><span></span><span></span></label>
  <nav class="menu">
    {{#site.cabecalho.menu}}<a href="{{link}}">{{rotulo}}</a>{{/site.cabecalho.menu}}
    {{#site.cabecalho.entrar}}<a class="entrar" href="{{link}}">{{rotulo}}</a>{{/site.cabecalho.entrar}}
    {{#site.cabecalho.botao}}<a class="btn-topo" href="{{link}}">{{rotulo}}</a>{{/site.cabecalho.botao}}
  </nav>
</header>
