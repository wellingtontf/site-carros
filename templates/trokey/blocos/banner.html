<!-- banner: imagem, alt, altura (p|m|g), titulo, subtitulo, link -->
<section class="b-banner altura-{{altura}}{{^imagem}} sem-imagem{{/imagem}}">
  {{#link}}<a href="{{link}}">{{/link}}
  {{#imagem}}<img src="{{imagem}}" alt="{{alt}}" loading="lazy">{{/imagem}}
  {{#titulo}}<div class="b-banner-txt"><h2>{{titulo}}</h2>{{#subtitulo}}<p>{{subtitulo}}</p>{{/subtitulo}}</div>{{/titulo}}
  {{#link}}</a>{{/link}}
</section>
