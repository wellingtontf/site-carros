<!-- cartoes: titulo, subtitulo, colunas, itens[{titulo, texto, imagem, link, botao}] -->
<section class="b-cartoes">
  {{#titulo}}<h2 class="b-titulo">{{titulo}}</h2>{{/titulo}}
  {{#subtitulo}}<p class="b-sub">{{subtitulo}}</p>{{/subtitulo}}
  <div class="b-cartoes-grade col-{{colunas}}">
    {{#itens}}<article class="b-cartao">
      {{#imagem}}<img src="{{imagem}}" alt="{{titulo}}" loading="lazy" width="200" height="200">{{/imagem}}
      {{^imagem}}<span class="b-cartao-icone" aria-hidden="true">&rarr;</span>{{/imagem}}
      <h3>{{#link}}<a href="{{link}}">{{titulo}}</a>{{/link}}{{^link}}{{titulo}}{{/link}}</h3>
      {{#texto}}<p>{{texto}}</p>{{/texto}}
      {{#botao}}<a class="b-btn" href="{{link}}">{{botao}}</a>{{/botao}}
    </article>{{/itens}}
  </div>
</section>
