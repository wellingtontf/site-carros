<!-- chamada: titulo, texto, botao, mensagem (WhatsApp), fundo (cor) -->
<section class="b-chamada" {{#fundo}}style="background:{{fundo}}"{{/fundo}}>
  <div class="b-chamada-in">
    <div>{{#titulo}}<h2>{{titulo}}</h2>{{/titulo}}{{#texto}}<p>{{texto}}</p>{{/texto}}</div>
    <a href="#" class="b-btn claro js-zap" data-msg="{{mensagem}}">{{botao}}</a>
  </div>
</section>
