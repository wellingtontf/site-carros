<!-- busca: titulo, subtitulo, botao, botaoEstoque. Envia para a listagem com ?q= e ?marca= (o motor lê esses parâmetros). -->
<section class="b-busca">
  <div class="b-busca-in">
    {{#titulo}}<h2>{{titulo}}</h2>{{/titulo}}
    {{#subtitulo}}<p>{{subtitulo}}</p>{{/subtitulo}}
    <form class="b-busca-form" action="{{estoqueUrl}}" method="get">
      <input type="search" name="q" placeholder="{{site.textos.busca}}" aria-label="Buscar">
      <select name="marca" aria-label="Marca"><option value="">Todas as marcas</option>{{#marcas}}<option>{{valor}}</option>{{/marcas}}</select>
      <button type="submit">{{botao}}{{^botao}}Buscar{{/botao}}</button>
    </form>
    {{#botaoEstoque}}<a class="b-busca-link" href="{{estoqueUrl}}">{{botaoEstoque}}</a>{{/botaoEstoque}}
  </div>
</section>
