<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>{{listagem.titulo}}</title><meta name="description" content="{{listagem.descricao}}">{{{listagem.canon}}}
<link rel="stylesheet" href="{{rel}}css/style.css"><style>{{{temaCss}}}</style></head>
<body data-page="lista" data-base="{{base}}" data-rel="{{rel}}" data-filtro="{{listagem.filtro}}">
<a class="marca" href="{{inicioUrl}}">{{site.nome}}</a>{{#configuracoes.logo}}<img src="{{configuracoes.logo}}" alt="">{{/configuracoes.logo}}
{{{secoesAntes}}}
<form id="filtros"><input type="search" id="q"><div id="filtros-dinamicos"></div><select id="ord"></select><span id="contagem"></span>
<button type="button" id="limpar">Limpar</button><button type="button" id="copiar">Copiar</button></form>
<div id="grade"></div><button id="mais" hidden>Mais</button>
{{{secoesDepois}}}
<script type="text/html" id="tpl-card"><a class="card" href="[[href]]"><img [[imgattrs]]><h3>[[nome]]</h3><p>[[preco]]</p><a href="[[zap]]">zap</a></a></script>
<script src="{{rel}}motor/engine.js"></script><script src="{{rel}}motor/ui-util.js"></script><script src="{{rel}}motor/link-carro.js"></script><script src="{{rel}}motor/ui-lista.js"></script>
{{#site.links}}<a class="legal" href="{{link}}">{{rotulo}}</a>{{/site.links}}<script src="{{rel}}motor/ui-site.js"></script></body></html>
