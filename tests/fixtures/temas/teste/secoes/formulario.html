<!-- formulario: titulo, subtitulo, botao, aviso, mensagem, campos[{rotulo, tipo, obrigatorio, dica, meia, opcoes | opcoesDe: "lojas"}]. Envia pelo WhatsApp (core/ui/ui-site.js). -->
<section class="b-form">
  {{#titulo}}<h2>{{titulo}}</h2>{{/titulo}}{{#subtitulo}}<p>{{subtitulo}}</p>{{/subtitulo}}
  <form class="b-form-campos js-form-zap" data-msg="{{mensagem}}">
    {{#campos}}<label class="b-campo{{#meia}} meia{{/meia}}" for="{{id}}"><span>{{rotulo}}{{#obrigatorio}} *{{/obrigatorio}}</span>
      {{#ehLinha}}<input id="{{id}}" name="{{nome}}" type="{{tipoHtml}}" placeholder="{{dica}}" {{#obrigatorio}}required{{/obrigatorio}}>{{/ehLinha}}
      {{#ehLista}}<select id="{{id}}" name="{{nome}}" {{#obrigatorio}}required{{/obrigatorio}}><option value="">Selecione</option>{{#opcoes}}<option>{{.}}</option>{{/opcoes}}</select>{{/ehLista}}
      {{#ehTextoLongo}}<textarea id="{{id}}" name="{{nome}}" rows="4" placeholder="{{dica}}" {{#obrigatorio}}required{{/obrigatorio}}></textarea>{{/ehTextoLongo}}
    </label>{{/campos}}
    <button type="submit" class="btn zap">{{botao}}{{^botao}}Enviar{{/botao}}</button>
    {{#aviso}}<p class="b-aviso">{{aviso}}</p>{{/aviso}}
  </form>
</section>
