# kubectl apply -k infra/k8s   (troque a imagem, o ID da conta, o EFS e o certificado antes)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: site-carros
resources:
  - namespace.yaml
  - armazenamento.yaml
  - configuracao.yaml
  - conta-servico.yaml
  - api.yaml
  - trabalhador.yaml
  - ingress.yaml
images:
  - name: site-carros
    newName: 123456789012.dkr.ecr.sa-east-1.amazonaws.com/site-carros
    newTag: "1.0.0"
