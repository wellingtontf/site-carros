# A API para os sistemas dos inquilinos (não os sites: os sites saem do S3 + CloudFront). ALB com HTTPS (ACM).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:sa-east-1:123456789012:certificate/troque
    alb.ingress.kubernetes.io/healthcheck-path: /v1/pronto
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=180   # ?esperar até 120 s
spec:
  ingressClassName: alb
  rules:
    - host: api.plataforma.exemplo.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api, port: { name: http } }
