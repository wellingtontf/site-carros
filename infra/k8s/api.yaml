# API: sem estado (tudo no volume), escala pela CPU. Recebe as chamadas dos sistemas dos inquilinos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: site-carros, papel: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: site-carros, papel: api }
  template:
    metadata:
      labels: { app: site-carros, papel: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8787"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: site-carros
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: site-carros, papel: api }
      containers:
        - name: api
          image: site-carros
          env:
            - { name: PAPEL, value: api }
          envFrom:
            - configMapRef: { name: site-carros }
            - secretRef: { name: site-carros }
          ports:
            - { name: http, containerPort: 8787 }
          readinessProbe:
            httpGet: { path: /v1/pronto, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/saude, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }      # estoque de até 100 MB por chamada
          volumeMounts:
            - { name: dados, mountPath: /dados }
      volumes:
        - name: dados
          persistentVolumeClaim: { claimName: dados }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: site-carros, papel: api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: site-carros, papel: api }
