<!doctype html>
<html lang="pt-BR">
<head>
{{> head}}
<title>{{listagem.titulo}}</title>
<meta name="description" content="{{listagem.descricao}}">
{{{listagem.canon}}}
</head>
<body data-page="lista" data-base="{{base}}" data-rel="{{rel}}" data-filtro="{{listagem.filtro}}">
{{> cabecalho}}
{{{secoesAntes}}}
<main class="multipla">
  <div class="multipla-corpo">
    <aside>{{componente filtro layout="lateral" titulo="Filtrar"}}</aside>
    <section>{{componente filtros-ativos}}{{componente estoque titulo="{{listagem.h1}}" tituloTag="h1" porPagina=24}}</section>
  </div>
</main>
{{{secoesDepois}}}
{{> rodape}}
<script src="{{rel}}motor/engine.js"></script>
<script src="{{rel}}motor/ui-util.js"></script>
<script src="{{rel}}motor/link-carro.js"></script>
<script src="{{rel}}motor/ui-lista.js"></script>
<script src="{{rel}}js/template-basico.js"></script>
</body>
</html>
